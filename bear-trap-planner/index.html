<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>곰덫 플래너 — PNX</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --border: #d8dde4;
      --fg: #1a1f29;
      --muted: #5a6470;
      --accent: #2563eb;
      --green-fill: rgba(34, 197, 94, 0.28);
      --green-stroke: rgba(34, 197, 94, 0.65);
      --blue-fill: rgba(59, 130, 246, 0.28);
      --blue-stroke: rgba(59, 130, 246, 0.65);
      --valid-fill: rgba(34, 197, 94, 0.35);
      --valid-stroke: rgba(34, 197, 94, 0.85);
      --invalid-fill: rgba(239, 68, 68, 0.32);
      --invalid-stroke: rgba(239, 68, 68, 0.8);
      --grid-line: #e5e7eb;
      --cell: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--fg);
      background: var(--bg);
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* 상단 툴바 */
    .topbar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .topbar button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      color: var(--fg);
    }
    .topbar button:hover { background: #f0f3f7; }
    .topbar button.danger { color: #b91c1c; border-color: #fecaca; }
    .topbar button.danger:hover { background: #fef2f2; }
    .topbar input[type=number] {
      width: 56px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
    }
    .topbar label { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; color: var(--muted); }
    .topbar .sep { flex: 1; }

    /* 본문 레이아웃 */
    .main {
      display: grid;
      grid-template-columns: 220px 1fr;
      overflow: hidden;
      min-height: 0;
    }

    /* 좌측 팔레트 */
    .palette {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 12px;
      overflow-y: auto;
    }
    .palette h3 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .pal-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 5px;
      border: 1px solid var(--border);
      background: white;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      color: var(--fg);
    }
    .pal-btn::before {
      content: '';
      display: block;
      width: 4px;
      align-self: stretch;
      background: var(--bld-color, #ccc);
      border-radius: 2px;
      margin: -8px 0 -8px -10px;
      margin-right: 6px;
    }
    .pal-btn:hover { background: #f5f8fb; }
    .pal-btn.active { background: #e0eaff; border-color: var(--accent); }
    .palette hr { margin: 12px 0; border: none; border-top: 1px solid var(--border); }
    .tool-btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 3px;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      color: var(--fg);
    }
    .tool-btn:hover { background: #f5f8fb; }
    .tool-btn.active { background: #e0eaff; color: var(--accent); border-color: #c7d8f7; }

    /* 캔버스 영역 */
    .canvas-wrap {
      overflow: auto;
      background: #eef2f6;
      position: relative;
    }
    .canvas-stage {
      position: relative;
      margin: auto;
    }
    .canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      transform-origin: center;
      background: white;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: var(--cell) var(--cell);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      cursor: crosshair;
      user-select: none;
      touch-action: none;
    }
    .canvas.tool-select { cursor: default; }
    .canvas.tool-pan { cursor: grab; }
    .canvas.tool-pan.panning { cursor: grabbing; }
    .canvas.tool-delete { cursor: not-allowed; }
    .canvas > * { pointer-events: none; }

    /* 영역 표시 */
    .zone {
      position: absolute;
      box-sizing: border-box;
    }
    .zone.green {
      background: var(--green-fill);
      border: 1px solid var(--green-stroke);
    }
    .zone.blue {
      background: var(--blue-fill);
      border: 1px solid var(--blue-stroke);
    }

    /* 배치된 객체 */
    .obj {
      position: absolute;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 11px;
      color: white;
      border: 2px solid;
      box-sizing: border-box;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }
    .obj > .label {
      transform: rotate(-45deg);
      white-space: nowrap;
      pointer-events: none;
    }
    .obj.selected {
      outline: 3px solid var(--accent);
      outline-offset: 1px;
      z-index: 10;
    }

    /* 배치 미리보기 (호버 고스트) */
    .ghost {
      position: absolute;
      border: 2px dashed;
      box-sizing: border-box;
      z-index: 50;
    }
    .ghost.valid { border-color: var(--valid-stroke); background: var(--valid-fill); }
    .ghost.invalid { border-color: var(--invalid-stroke); background: var(--invalid-fill); }
    .ghost.hidden { display: none; }

    /* 하단 범례 */
    .legend {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      gap: 18px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .legend .sw {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 4px;
      vertical-align: -3px;
      border: 1px solid;
      border-radius: 2px;
    }
    .legend .sw.blue { background: var(--blue-fill); border-color: var(--blue-stroke); }
    .legend .sw.green { background: var(--green-fill); border-color: var(--green-stroke); }
    .legend .sw.valid { background: var(--valid-fill); border-color: var(--valid-stroke); }
    .legend .sw.invalid { background: var(--invalid-fill); border-color: var(--invalid-stroke); }

    /* 모달 */
    dialog {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
      width: 480px;
      max-width: 90vw;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
    .dlg-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dlg-head h2 { margin: 0; font-size: 15px; }
    .dlg-head .x {
      border: none;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      color: var(--muted);
      padding: 0 4px;
    }
    .dlg-body { padding: 16px; }
    .dlg-foot {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    dialog textarea {
      width: 100%;
      height: 200px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      resize: vertical;
    }
    dialog button {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
    }
    dialog button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .samples-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .sample-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 10px;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      background: white;
    }
    .sample-card:hover { background: #f5f8fb; border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="topbar">
    <button id="btn-clear" class="danger">비우기</button>
    <button id="btn-export-png">PNG 내보내기</button>
    <button id="btn-export-text">텍스트 내보내기</button>
    <button id="btn-import-text">텍스트 가져오기</button>
    <button id="btn-samples">샘플</button>
    <span class="sep"></span>
    <label>너비: <input id="in-width" type="number" min="10" max="200" /></label>
    <label>높이: <input id="in-height" type="number" min="10" max="200" /></label>
    <button id="btn-resize">크기 조절</button>
  </header>

  <div class="main">
    <aside class="palette">
      <h3>도구</h3>
      <button class="pal-btn" data-bld="pitfall" style="--bld-color:#7a4a2c">곰덫 (3×3)</button>
      <button class="pal-btn" data-bld="tc"      style="--bld-color:#5470c2">도시 중심 (2×2)</button>
      <button class="pal-btn" data-bld="banner"  style="--bld-color:#f4c542">깃발 (1×1)</button>
      <button class="pal-btn" data-bld="mills"   style="--bld-color:#3aa67a">연맹 제분소 (2×2)</button>
      <button class="pal-btn" data-bld="hq"      style="--bld-color:#7e57c2">연맹 본부 (3×3)</button>
      <button class="pal-btn" data-bld="block_s" style="--bld-color:#666">장애물 (1×1)</button>
      <button class="pal-btn" data-bld="block_l" style="--bld-color:#666">장애물 (2×2)</button>
      <hr />
      <button class="tool-btn" data-tool="select">선택/이동</button>
      <button class="tool-btn" data-tool="pan">화면 이동</button>
      <button class="tool-btn" data-tool="delete">삭제</button>
    </aside>

    <div class="canvas-wrap" id="canvas-wrap">
      <div class="canvas-stage" id="stage">
        <div class="canvas" id="canvas"></div>
      </div>
    </div>
  </div>

  <footer class="legend">
    <span><span class="sw blue"></span>연맹 영역 (파랑)</span>
    <span><span class="sw green"></span>건설 가능 (초록)</span>
    <span><span class="sw valid"></span>배치 가능</span>
    <span><span class="sw invalid"></span>배치 불가</span>
  </footer>

  <dialog id="dlg-export">
    <div class="dlg-head">
      <h2>레이아웃 내보내기</h2>
      <button class="x dlg-close">×</button>
    </div>
    <div class="dlg-body">
      <textarea id="export-textarea" readonly></textarea>
    </div>
    <div class="dlg-foot">
      <button id="btn-copy-export">클립보드에 복사</button>
      <button class="dlg-close primary">닫기</button>
    </div>
  </dialog>

  <dialog id="dlg-import">
    <div class="dlg-head">
      <h2>레이아웃 가져오기</h2>
      <button class="x dlg-close">×</button>
    </div>
    <div class="dlg-body">
      <textarea id="import-textarea" placeholder="내보낸 JSON 을 여기에 붙여넣어 주세요..."></textarea>
    </div>
    <div class="dlg-foot">
      <button class="dlg-close">취소</button>
      <button id="btn-do-import" class="primary">가져오기</button>
    </div>
  </dialog>

  <dialog id="dlg-samples">
    <div class="dlg-head">
      <h2>샘플 레이아웃</h2>
      <button class="x dlg-close">×</button>
    </div>
    <div class="dlg-body">
      <div class="samples-grid" id="samples-grid"></div>
    </div>
    <div class="dlg-foot">
      <button class="dlg-close">닫기</button>
    </div>
  </dialog>

  <script>
    'use strict';

    // ---- 건물 정의 ----
    const BLD = {
      pitfall: { name: '곰덫',         w: 3, h: 3, fill: '#7a4a2c', stroke: '#3d2113', text: '곰덫' },
      tc:      { name: '도시 중심',    w: 2, h: 2, fill: '#5470c2', stroke: '#2a3a8e', text: '도시' },
      banner:  { name: '깃발',         w: 1, h: 1, fill: '#f4c542', stroke: '#9a7600', text: '깃' },
      mills:   { name: '연맹 제분소',  w: 2, h: 2, fill: '#3aa67a', stroke: '#1f5e44', text: '제분' },
      hq:      { name: '연맹 본부',    w: 3, h: 3, fill: '#7e57c2', stroke: '#4a2e8c', text: '본부' },
      block_s: { name: '장애물',       w: 1, h: 1, fill: '#666',    stroke: '#333',    text: '' },
      block_l: { name: '장애물 (큰)',  w: 2, h: 2, fill: '#666',    stroke: '#333',    text: '' },
    };

    // 'blue' = 모든 셀이 파랑(연맹 영역)이어야 함
    // 'any'  = 격자 안이면 어디든 가능 (영역 생성기 본인은 어디든)
    const PLACEMENT = {
      pitfall: 'blue',   // 곰덫: 연맹 영역 안에서만
      tc:      'blue',   // 도시 중심: 연맹 영역 안에서만
      banner:  'any',    // 깃발: 어디든 (스스로 영역 생성)
      mills:   'blue',   // 연맹 제분소: 연맹 영역 안에서만
      hq:      'any',    // 연맹 본부: 어디든 (스스로 영역 생성)
      block_s: 'any',    // 장애물: 어디든
      block_l: 'any',
    };

    const state = {
      cell: 16,
      width: 80,
      height: 80,
      objects: [],
      bannerRadius: 3,
      mode: { kind: 'idle' },
      drag: null,
      ghost: null,
      selectedId: null,
      nextId: 1,
    };

    // ---- DOM 참조 ----
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const canvas = $('#canvas');
    const stage = $('#stage');
    const canvasWrap = $('#canvas-wrap');

    // ---- 영역 계산 ----
    function blueCells() {
      const set = new Set();
      for (const obj of state.objects) {
        if (obj.type !== 'banner') continue;
        const r = state.bannerRadius;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const cx = obj.x + dx, cy = obj.y + dy;
            if (cx >= 0 && cx < state.width && cy >= 0 && cy < state.height) {
              set.add(cx + ',' + cy);
            }
          }
        }
      }
      return set;
    }
    function isBlue(x, y, blueSet) { return blueSet.has(x + ',' + y); }

    function isValidPlacement(type, x, y, ignoreId) {
      const def = BLD[type];
      if (x < 0 || y < 0 || x + def.w > state.width || y + def.h > state.height) return false;
      for (const obj of state.objects) {
        if (obj.id === ignoreId) continue;
        const o = BLD[obj.type];
        if (x < obj.x + o.w && x + def.w > obj.x &&
            y < obj.y + o.h && y + def.h > obj.y) return false;
      }
      const rule = PLACEMENT[type];
      if (rule === 'any') return true;
      const blueSet = blueCells();
      for (let dy = 0; dy < def.h; dy++) {
        for (let dx = 0; dx < def.w; dx++) {
          if (rule === 'blue' && !isBlue(x + dx, y + dy, blueSet)) return false;
        }
      }
      return true;
    }

    // ---- 렌더링 ----
    function applyDimensions() {
      const wpx = state.width * state.cell;
      const hpx = state.height * state.cell;
      canvas.style.width = wpx + 'px';
      canvas.style.height = hpx + 'px';
      const diag = Math.ceil(Math.sqrt(wpx * wpx + hpx * hpx)) + 60;
      stage.style.width = diag + 'px';
      stage.style.height = diag + 'px';
      document.documentElement.style.setProperty('--cell', state.cell + 'px');
    }
    function centerView() {
      canvasWrap.scrollLeft = (canvasWrap.scrollWidth - canvasWrap.clientWidth) / 2;
      canvasWrap.scrollTop  = (canvasWrap.scrollHeight - canvasWrap.clientHeight) / 2;
    }

    function renderZones() {
      canvas.querySelectorAll('.zone').forEach((el) => el.remove());
      // 깃발마다 파란 영역
      for (const obj of state.objects) {
        if (obj.type !== 'banner') continue;
        const r = state.bannerRadius;
        const bx = Math.max(0, obj.x - r);
        const by = Math.max(0, obj.y - r);
        const bw = Math.min(state.width, obj.x + r + 1) - bx;
        const bh = Math.min(state.height, obj.y + r + 1) - by;
        const be = document.createElement('div');
        be.className = 'zone blue';
        be.style.left = (bx * state.cell) + 'px';
        be.style.top = (by * state.cell) + 'px';
        be.style.width = (bw * state.cell) + 'px';
        be.style.height = (bh * state.cell) + 'px';
        canvas.appendChild(be);
      }
    }

    function renderObjects() {
      canvas.querySelectorAll('.obj').forEach((el) => el.remove());
      for (const obj of state.objects) {
        const def = BLD[obj.type];
        const el = document.createElement('div');
        el.className = 'obj' + (obj.id === state.selectedId ? ' selected' : '');
        el.dataset.id = obj.id;
        el.style.left = (obj.x * state.cell) + 'px';
        el.style.top = (obj.y * state.cell) + 'px';
        el.style.width = (def.w * state.cell) + 'px';
        el.style.height = (def.h * state.cell) + 'px';
        el.style.background = def.fill;
        el.style.borderColor = def.stroke;
        if (def.text) {
          const lbl = document.createElement('span');
          lbl.className = 'label';
          lbl.textContent = def.text;
          el.appendChild(lbl);
        }
        canvas.appendChild(el);
      }
    }

    function renderGhost() {
      let el = canvas.querySelector('.ghost');
      if (!el) {
        el = document.createElement('div');
        el.className = 'ghost hidden';
        canvas.appendChild(el);
      }
      if (!state.ghost) {
        el.className = 'ghost hidden';
        return;
      }
      const def = BLD[state.ghost.type];
      el.className = 'ghost ' + (state.ghost.valid ? 'valid' : 'invalid');
      el.style.left = (state.ghost.x * state.cell) + 'px';
      el.style.top = (state.ghost.y * state.cell) + 'px';
      el.style.width = (def.w * state.cell) + 'px';
      el.style.height = (def.h * state.cell) + 'px';
    }

    function renderAll() { renderZones(); renderObjects(); renderGhost(); }

    // ---- 좌표 변환 ----
    // 회전된 캔버스의 clientX/Y → 캔버스 로컬(회전 전) 셀 좌표
    // 캔버스는 자기 중심을 축으로 시계방향 45° 회전. 역회전(-45°) 적용.
    function getCell(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      // 역회전 -45°: (lx, ly) = ((dx + dy)/√2, (-dx + dy)/√2)
      const s = Math.SQRT1_2;
      const lx = (dx + dy) * s;
      const ly = (-dx + dy) * s;
      const wpx = state.width * state.cell;
      const hpx = state.height * state.cell;
      const px = lx + wpx / 2;
      const py = ly + hpx / 2;
      return { x: Math.floor(px / state.cell), y: Math.floor(py / state.cell) };
    }

    function hitTest(x, y) {
      for (let i = state.objects.length - 1; i >= 0; i--) {
        const obj = state.objects[i];
        const def = BLD[obj.type];
        if (x >= obj.x && x < obj.x + def.w && y >= obj.y && y < obj.y + def.h) return obj;
      }
      return null;
    }

    // 커서 셀이 객체의 중앙에 오도록 상단-좌측 좌표 보정
    function centerOffset(type, cx, cy) {
      const def = BLD[type];
      return { x: cx - Math.floor(def.w / 2), y: cy - Math.floor(def.h / 2) };
    }

    // ---- 포인터 인터랙션 ----
    let panData = null;

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);

      if (state.mode.kind === 'pan') {
        panData = {
          sx: e.clientX, sy: e.clientY,
          scrollLeft: canvasWrap.scrollLeft, scrollTop: canvasWrap.scrollTop,
        };
        canvas.classList.add('panning');
        return;
      }

      const { x: cellX, y: cellY } = getCell(e);
      if (cellX < 0 || cellY < 0 || cellX >= state.width || cellY >= state.height) return;

      if (state.mode.kind === 'place') {
        const p = centerOffset(state.mode.type, cellX, cellY);
        if (isValidPlacement(state.mode.type, p.x, p.y)) {
          state.objects.push({ id: state.nextId++, type: state.mode.type, x: p.x, y: p.y });
          renderAll();
        }
      } else if (state.mode.kind === 'select' || state.mode.kind === 'idle') {
        const hit = hitTest(cellX, cellY);
        if (hit) {
          state.selectedId = hit.id;
          state.drag = {
            id: hit.id,
            ox: cellX - hit.x, oy: cellY - hit.y,
            origX: hit.x, origY: hit.y,
          };
        } else {
          state.selectedId = null;
        }
        renderObjects();
      } else if (state.mode.kind === 'delete') {
        const hit = hitTest(cellX, cellY);
        if (hit) {
          state.objects = state.objects.filter((o) => o.id !== hit.id);
          renderAll();
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (panData) {
        canvasWrap.scrollLeft = panData.scrollLeft - (e.clientX - panData.sx);
        canvasWrap.scrollTop  = panData.scrollTop  - (e.clientY - panData.sy);
        return;
      }
      const { x: cellX, y: cellY } = getCell(e);

      if (state.mode.kind === 'place') {
        const p = centerOffset(state.mode.type, cellX, cellY);
        const valid = isValidPlacement(state.mode.type, p.x, p.y);
        state.ghost = { type: state.mode.type, x: p.x, y: p.y, valid };
        renderGhost();
      } else if (state.drag) {
        const obj = state.objects.find((o) => o.id === state.drag.id);
        if (!obj) return;
        obj.x = cellX - state.drag.ox;
        obj.y = cellY - state.drag.oy;
        renderAll();
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      if (panData) {
        panData = null;
        canvas.classList.remove('panning');
        return;
      }
      if (state.drag) {
        const obj = state.objects.find((o) => o.id === state.drag.id);
        if (obj && !isValidPlacement(obj.type, obj.x, obj.y, obj.id)) {
          obj.x = state.drag.origX;
          obj.y = state.drag.origY;
          renderAll();
        }
        state.drag = null;
      }
    });

    canvas.addEventListener('pointerleave', () => {
      if (panData) return;
      state.ghost = null;
      renderGhost();
    });

    // ---- 팔레트 / 도구 ----
    function setActiveButton(activeBtn) {
      $$('.pal-btn, .tool-btn').forEach((b) => b.classList.remove('active'));
      if (activeBtn) activeBtn.classList.add('active');
    }
    function setCanvasCursor() {
      const cls = ['canvas'];
      if (state.mode.kind === 'select') cls.push('tool-select');
      else if (state.mode.kind === 'pan') cls.push('tool-pan');
      else if (state.mode.kind === 'delete') cls.push('tool-delete');
      canvas.className = cls.join(' ');
    }

    $$('.pal-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.mode = { kind: 'place', type: btn.dataset.bld };
        state.selectedId = null;
        state.ghost = null;
        setActiveButton(btn);
        setCanvasCursor();
        renderAll();
      });
    });
    $$('.tool-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.mode = { kind: btn.dataset.tool };
        state.ghost = null;
        setActiveButton(btn);
        setCanvasCursor();
        renderAll();
      });
    });

    // ---- 툴바 버튼 ----
    $('#btn-clear').addEventListener('click', () => {
      if (!confirm('전체 비우기?')) return;
      state.objects = [];
      state.selectedId = null;
      renderAll();
    });

    $('#btn-resize').addEventListener('click', () => {
      const w = parseInt($('#in-width').value, 10);
      const h = parseInt($('#in-height').value, 10);
      if (!Number.isFinite(w) || !Number.isFinite(h) || w < 10 || h < 10 || w > 200 || h > 200) {
        alert('너비/높이: 10~200'); return;
      }
      state.width = w;
      state.height = h;
      state.objects = state.objects.filter((o) => {
        const d = BLD[o.type];
        return o.x >= 0 && o.y >= 0 && o.x + d.w <= w && o.y + d.h <= h;
      });
      applyDimensions();
      renderAll();
      centerView();
    });

    // ---- 텍스트 내보내기 ----
    $('#btn-export-text').addEventListener('click', () => {
      const data = {
        version: 1,
        width: state.width,
        height: state.height,
        bannerRadius: state.bannerRadius,
        objects: state.objects.map((o) => ({ type: o.type, x: o.x, y: o.y })),
      };
      $('#export-textarea').value = JSON.stringify(data, null, 2);
      $('#dlg-export').showModal();
    });
    $('#btn-copy-export').addEventListener('click', async () => {
      const ta = $('#export-textarea');
      try {
        await navigator.clipboard.writeText(ta.value);
      } catch (_) {
        ta.select(); document.execCommand('copy');
      }
      const btn = $('#btn-copy-export');
      const orig = btn.textContent;
      btn.textContent = '복사됨!';
      setTimeout(() => { btn.textContent = orig; }, 1200);
    });

    // ---- 텍스트 가져오기 ----
    $('#btn-import-text').addEventListener('click', () => {
      $('#import-textarea').value = '';
      $('#dlg-import').showModal();
    });
    $('#btn-do-import').addEventListener('click', () => {
      try {
        const data = JSON.parse($('#import-textarea').value);
        if (!data.version || !Array.isArray(data.objects)) throw new Error('형식 오류');
        state.width = data.width || 80;
        state.height = data.height || 80;
        state.bannerRadius = data.bannerRadius != null ? data.bannerRadius : 3;
        state.objects = data.objects
          .filter((o) => BLD[o.type])
          .map((o) => ({ id: state.nextId++, type: o.type, x: o.x | 0, y: o.y | 0 }));
        state.selectedId = null;
        $('#in-width').value = state.width;
        $('#in-height').value = state.height;
        applyDimensions();
        renderAll();
        centerView();
        $('#dlg-import').close();
      } catch (err) {
        alert('잘못된 JSON: ' + err.message);
      }
    });

    // ---- PNG 내보내기 (회전 적용) ----
    $('#btn-export-png').addEventListener('click', exportPNG);

    function exportPNG() {
      const wpx = state.width * state.cell;
      const hpx = state.height * state.cell;
      const diag = Math.ceil(Math.sqrt(wpx * wpx + hpx * hpx)) + 40;
      const c = document.createElement('canvas');
      c.width = diag; c.height = diag;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#eef2f6';
      ctx.fillRect(0, 0, diag, diag);
      ctx.save();
      ctx.translate(diag / 2, diag / 2);
      ctx.rotate(Math.PI / 4);
      ctx.translate(-wpx / 2, -hpx / 2);

      // 캔버스 배경
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, wpx, hpx);

      // 격자선
      ctx.strokeStyle = '#e5e7eb';
      ctx.lineWidth = 1;
      for (let i = 0; i <= state.width; i++) {
        ctx.beginPath();
        ctx.moveTo(i * state.cell + 0.5, 0);
        ctx.lineTo(i * state.cell + 0.5, hpx);
        ctx.stroke();
      }
      for (let i = 0; i <= state.height; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * state.cell + 0.5);
        ctx.lineTo(wpx, i * state.cell + 0.5);
        ctx.stroke();
      }

      // 파란 영역
      for (const obj of state.objects) {
        if (obj.type !== 'banner') continue;
        const r = state.bannerRadius;
        const bx = Math.max(0, obj.x - r);
        const by = Math.max(0, obj.y - r);
        const bw = Math.min(state.width, obj.x + r + 1) - bx;
        const bh = Math.min(state.height, obj.y + r + 1) - by;
        ctx.fillStyle = 'rgba(59,130,246,0.28)';
        ctx.strokeStyle = 'rgba(59,130,246,0.65)';
        ctx.fillRect(bx*state.cell, by*state.cell, bw*state.cell, bh*state.cell);
        ctx.strokeRect(bx*state.cell, by*state.cell, bw*state.cell, bh*state.cell);
      }

      // 객체 + 라벨(역회전으로 직립)
      for (const obj of state.objects) {
        const def = BLD[obj.type];
        const ox = obj.x * state.cell, oy = obj.y * state.cell;
        const ow = def.w * state.cell, oh = def.h * state.cell;
        ctx.fillStyle = def.fill;
        ctx.strokeStyle = def.stroke;
        ctx.lineWidth = 2;
        ctx.fillRect(ox, oy, ow, oh);
        ctx.strokeRect(ox, oy, ow, oh);
        if (def.text) {
          ctx.save();
          ctx.translate(ox + ow/2, oy + oh/2);
          ctx.rotate(-Math.PI / 4);
          ctx.fillStyle = 'white';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(def.text, 0, 0);
          ctx.restore();
        }
      }
      ctx.restore();

      c.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '곰덫-레이아웃.png';
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    // ---- 샘플 ----
    const SAMPLES = [
      {
        name: '빈 80×80',
        data: { version: 1, width: 80, height: 80, bannerRadius: 3, objects: [] }
      },
      {
        name: '곰덫 1 + 깃발 4',
        data: {
          version: 1, width: 80, height: 80, bannerRadius: 3,
          objects: [
            { type: 'banner', x: 36, y: 36 },
            { type: 'banner', x: 43, y: 36 },
            { type: 'banner', x: 36, y: 43 },
            { type: 'banner', x: 43, y: 43 },
            { type: 'pitfall', x: 38, y: 38 },
          ]
        }
      },
      {
        name: '본부 + 제분소 군집',
        data: {
          version: 1, width: 80, height: 80, bannerRadius: 3,
          objects: [
            { type: 'banner', x: 38, y: 35 },
            { type: 'banner', x: 38, y: 42 },
            { type: 'hq',     x: 36, y: 37 },
            { type: 'mills',  x: 33, y: 38 },
            { type: 'mills',  x: 41, y: 38 },
          ]
        }
      },
    ];

    $('#btn-samples').addEventListener('click', () => {
      const grid = $('#samples-grid');
      grid.innerHTML = '';
      for (const s of SAMPLES) {
        const div = document.createElement('div');
        div.className = 'sample-card';
        div.textContent = s.name;
        div.addEventListener('click', () => {
          const d = s.data;
          state.width = d.width;
          state.height = d.height;
          state.bannerRadius = d.bannerRadius;
          state.objects = d.objects.map((o) => ({ id: state.nextId++, type: o.type, x: o.x, y: o.y }));
          state.selectedId = null;
          $('#in-width').value = state.width;
          $('#in-height').value = state.height;
          applyDimensions();
          renderAll();
          centerView();
          $('#dlg-samples').close();
        });
        grid.appendChild(div);
      }
      $('#dlg-samples').showModal();
    });

    // ---- 모달 닫기 ----
    $$('.dlg-close').forEach((btn) => {
      btn.addEventListener('click', (e) => e.target.closest('dialog').close());
    });

    // ---- 초기화 ----
    $('#in-width').value = state.width;
    $('#in-height').value = state.height;
    applyDimensions();
    renderAll();
    centerView();
  </script>
</body>
</html>
